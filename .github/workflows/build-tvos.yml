name: Build tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-tvos:
    name: Build tvOS IPA
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout
        uses: actions/checkout@v6

      - name: Swap tvOS sources and patch project
        run: |
          rm -rf HDrezka/iOS
          cp -r HDrezka/tvOS HDrezka/iOS
          # Patch pbxproj: add appletvos to SUPPORTED_PLATFORMS
          sed -i '' 's/SUPPORTED_PLATFORMS = "iphoneos iphonesimulator macosx";/SUPPORTED_PLATFORMS = "iphoneos iphonesimulator macosx appletvos appletvsimulator";/' HDrezka.xcodeproj/project.pbxproj
          # Add TVOS_DEPLOYMENT_TARGET
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0; TVOS_DEPLOYMENT_TARGET = 17.0;/' HDrezka.xcodeproj/project.pbxproj
          # Change UIDeviceFamily in pbxproj to include tvOS (3)
          sed -i '' 's/TARGETED_DEVICE_FAMILY = 2;/TARGETED_DEVICE_FAMILY = "1,2,3";/' HDrezka.xcodeproj/project.pbxproj

      - name: Build for tvOS
        run: |
          xcodebuild clean archive \
            -project HDrezka.xcodeproj \
            -scheme HDrezka \
            -configuration Release \
            -sdk appletvos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=io.silentsea.hdrezka \
            archive -archivePath build/HDrezka

      - name: Create IPA
        run: |
          mkdir Payload
          cp -R build/HDrezka.xcarchive/Products/Applications/HDrezka.app Payload/
          zip -r HDrezkaTV.ipa Payload -x "._*" -x ".DS_Store" -x "__MACOSX"
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: HDrezkaTV.ipa
          path: HDrezkaTV.ipa