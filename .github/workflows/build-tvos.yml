name: Build tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-tvos:
    name: Build tvOS IPA
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout
        uses: actions/checkout@v6

      - name: Swap tvOS sources
        run: |
          rm -rf HDrezka/iOS
          cp -r HDrezka/tvOS HDrezka/iOS
          rm -rf HDrezka/iOS/Resources/Info.plist
          rm -rf HDrezka/tvOS

      - name: Build for tvOS
        run: |
          xcodebuild archive \
            -project HDrezka.xcodeproj \
            -scheme HDrezka \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO \
            -archivePath build/HDrezka

      - name: Create IPA
        run: |
          mkdir Payload
          cp -R build/HDrezka.xcarchive/Products/Applications/HDrezka.app Payload/
          zip -r HDrezkaTV.ipa Payload -x "._*" -x ".DS_Store" -x "__MACOSX"
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: HDrezkaTV.ipa
          path: HDrezkaTV.ipa