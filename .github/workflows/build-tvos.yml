name: Build tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-tvos:
    name: Build tvOS IPA
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare tvOS sources
        run: |
          rm -rf HDrezka/iOS
          cp -r HDrezka/tvOS HDrezka/iOS
          rm -rf HDrezka/tvOS
          # Nuke all Info.plist so Xcode has nothing to conflict with
          find . -name "Info.plist" -not -path "./.git/*" -delete

      - name: Build for tvOS
        run: |
          xcodebuild -project HDrezka.xcodeproj \
            -scheme HDrezka \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO \
            GENERATE_INFOPLIST_FILE=YES \
            INFOPLIST_FILE= \
            INFOPLIST_KEY_CFBundleDisplayName=HDrezka \
            INFOPLIST_KEY_UIDeviceFamily=3 \
            INFOPLIST_KEY_UISupportedInterfaceOrientations="UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight" \
            INFOPLIST_KEY_LSRequiresIPhoneOS=NO \
            INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents=NO \
            clean build

      - name: Create IPA
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "HDrezka.app" -path "*/Release-appletvos/*" | head -1)
          echo "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          cd Payload && zip -r ../HDrezkaTV.ipa . -x "._*" -x ".DS_Store" && cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: HDrezkaTV.ipa
          path: HDrezkaTV.ipa