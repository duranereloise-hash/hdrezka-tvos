name: Build tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-tvos:
    name: Build tvOS IPA
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout
        uses: actions/checkout@v6

      - name: Swap iOS with tvOS sources
        run: |
          rm -rf HDrezka/iOS
          cp -r HDrezka/tvOS HDrezka/iOS

      - name: Build for tvOS
        run: |
          xcodebuild -project HDrezka.xcodeproj \
            -scheme HDrezka \
            -configuration Release \
            -sdk appletvos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            SUPPORTED_PLATFORMS=appletvos \
            TARGETED_DEVICE_FAMILY=3 \
            SDKROOT=appletvos \
            PRODUCT_NAME=HDrezka \
            GENERATE_INFOPLIST_FILE=YES \
            clean archive -archivePath build/HDrezkaTV

      - name: Create IPA
        run: |
          mkdir Payload
          cp -R build/HDrezkaTV.xcarchive/Products/Applications/HDrezka.app Payload/
          zip -r HDrezkaTV.ipa Payload -x "._*" -x ".DS_Store" -x "__MACOSX"
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: HDrezkaTV.ipa
          path: HDrezkaTV.ipa