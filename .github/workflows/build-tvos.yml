name: Build tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-tvos:
    name: Build tvOS IPA
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout
        uses: actions/checkout@v6

      - name: Swap tvOS sources
        run: |
          rm -rf HDrezka/iOS
          cp -r HDrezka/tvOS HDrezka/iOS
          find HDrezka/iOS -name "Info.plist" -delete
          find HDrezka/iOS -name "InfoPlist.xcstrings" -delete

      - name: Build for tvOS
        run: |
          xcodebuild clean build \
            -project HDrezka.xcodeproj \
            -scheme HDrezka \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO \
            GENERATE_INFOPLIST_FILE=YES \
            INFOPLIST_FILE=

      - name: Locate and package IPA
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "HDrezka.app" -ipath "*/Release-appletvos/*" | head -1)
          echo "App: $APP"
          if [ -z "$APP" ]; then
            ls -la ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-appletvos/ || true
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          cd Payload && zip -r ../HDrezkaTV.ipa . -x "._*" -x ".DS_Store" && cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: HDrezkaTV.ipa
          path: HDrezkaTV.ipa