name: Build tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-tvos:
    name: Build tvOS IPA
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout
        uses: actions/checkout@v6

      - name: Swap tvOS sources and strip Info.plist references
        run: |
          rm -rf HDrezka/iOS
          cp -r HDrezka/tvOS HDrezka/iOS
          # Remove all Info.plist from source tree so GENERATE_INFOPLIST_FILE works cleanly
          find HDrezka/iOS -name "Info.plist" -delete
          find HDrezka/iOS -name "InfoPlist.xcstrings" -delete
          # Remove Firebase Crashlytics run script (tvOS incompatible)
          sed -i '' '/Firebase\|GoogleService-Info\|Crashlytics/d' HDrezka.xcodeproj/project.pbxproj

      - name: Build for tvOS
        run: |
          # Remove Info.plist that gets auto-added to Copy Bundle Resources
          rm -f HDrezka/iOS/Resources/Info.plist
          xcodebuild clean archive \
            -project HDrezka.xcodeproj \
            -scheme HDrezka \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO \
            GENERATE_INFOPLIST_FILE=YES \
            INFOPLIST_FILE= \
            -archivePath build/HDrezka 2>&1 | tee build.log
      
      - name: Show build errors
        run: |
          grep -E "error:|BUILD FAILED|ARCHIVE FAILED" build.log || echo "No errors found"

      - name: Create IPA
        run: |
          mkdir Payload
          cp -R build/HDrezka.xcarchive/Products/Applications/HDrezka.app Payload/
          zip -r HDrezkaTV.ipa Payload -x "._*" -x ".DS_Store" -x "__MACOSX"
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: HDrezkaTV.ipa
          path: HDrezkaTV.ipa